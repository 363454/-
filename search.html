         '<span class="book-card__meta-item">' + (a2 ? "作者：" + a2 : "作者：未知") + '</span></div>';
  }
  hd.innerHTML = "“" + kw.replace(/</g, "&lt;") + "” 共 " + hits.length + " 本（本地索引 " + D.length + " 本）";
  box.innerHTML = h || '<p class="empty">索引里没有这本书</p>';
})();
</script>
